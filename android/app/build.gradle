plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

// API-ключ Yandex MapKit: из env (CI) или local.properties (локально).
// НЕ коммитим ключ в репозиторий.
def mapkitApiKey = System.getenv("MAPKIT_API_KEY") ?: localProperties.getProperty("MAPKIT_API_KEY", "")

android {
    namespace = "com.github.davidgo134.cellka"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    // Java 21: нативная библиотека Yandex MapKit собрана под class file 65
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = "21"
    }

    defaultConfig {
        applicationId = "com.github.davidgo134.cellka"
        minSdk = 26 // требование пакета yandex_mapkit
        targetSdk = flutter.targetSdkVersion
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
        buildConfigField "String", "MAPKIT_API_KEY", "\"${mapkitApiKey}\""
    }

    buildFeatures {
        buildConfig = true
    }

    buildTypes {
        release {
            // TODO: релизная подпись — https://docs.flutter.dev/deployment/android#signing-the-app
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
