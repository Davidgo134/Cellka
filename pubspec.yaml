name: cellka
description: Open-source cellular network mapper with satellite map view (Yandex MapKit).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  yandex_mapkit: ^4.0.0
  geolocator: ^12.0.0
  sqflite: ^2.3.3
  path_provider: ^2.1.3
  provider: ^6.1.2
  permission_handler: ^11.3.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
