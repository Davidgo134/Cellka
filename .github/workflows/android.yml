name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test

  build-debug-apk:
    name: Build debug APK
    needs: analyze-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # Догенерирует недостающие бинарные файлы (gradle wrapper jar, иконки),
      # не перезаписывая запушенные вручную (AndroidManifest, MainActivity, gradle-скрипты).
      - name: Restore missing generated files
        run: flutter create --platforms=android --project-name cellka --org com.github.davidgo134 .
      - run: flutter pub get
      - name: Build debug APK
        env:
          MAPKIT_API_KEY: ${{ secrets.YANDEX_MAPKIT_API_KEY }}
        run: flutter build apk --debug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cellka-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
