name: Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Версия релиза (создаст тег и релиз с APK)'
        required: true
        default: 'v0.1.0'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Scaffold android wrapper
        run: flutter create . --platforms android --project-name cellka --org com.github.davidgo134

      - name: Generate launcher icons
        run: |
          python3 -m pip install --quiet pillow
          python3 tools/gen_icons.py

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test

      - name: Build release APK
        env:
          MAPKIT_API_KEY: ${{ secrets.YANDEX_MAPKIT_API_KEY }}
        run: >-
          flutter build apk --release
          --dart-define=OPENCELLID_API_KEY=${{ secrets.OPENCELLID_API_KEY }}

      # MVP: подписываем одноразовым ключом, генерируемым в CI.
      # Для публикации заменить на настоящий keystore из секретов.
      - name: Sign APK
        run: |
          set -e
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=build/app/outputs/flutter-apk/app-release-unsigned.apk
          keytool -genkeypair -v -keystore ci.jks -alias cellka \
            -keyalg RSA -keysize 2048 -validity 36500 \
            -storepass cellka-ci -keypass cellka-ci -dname "CN=Cellka CI"
          "$BT/zipalign" -p 4 "$APK" cellka-aligned.apk
          "$BT/apksigner" sign --ks ci.jks --ks-pass pass:cellka-ci \
            --out cellka-release.apk cellka-aligned.apk

      - uses: actions/upload-artifact@v4
        with:
          name: cellka-release-apk
          path: cellka-release.apk

      # Тег берём из input (ручной запуск) или из ref (push тега);
      # action-gh-release создаст тег, если его нет.
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: cellka-release.apk
          generate_release_notes: true
