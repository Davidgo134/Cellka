name: Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Версия релиза (создаст тег и релиз с APK)'
        required: true
        default: 'v0.1.1'

# Иначе GITHUB_TOKEN с дефолтным read-only не может создать релиз (403).
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Scaffold android wrapper
        run: flutter create . --platforms android --project-name cellka --org com.github.davidgo134

      - name: Generate launcher icons
        run: |
          python3 -m pip install --quiet pillow
          python3 tools/gen_icons.py

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test

      # v0.1.1 → versionName 0.1.1, versionCode 101 (major·10000 + minor·100 + patch)
      - name: Version from tag
        id: ver
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          V="${TAG#v}"
          IFS=. read -r MA MI PA <<< "$V"
          CODE=$(( 10#$MA * 10000 + 10#$MI * 100 + 10#${PA:-0} ))
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        env:
          MAPKIT_API_KEY: ${{ secrets.YANDEX_MAPKIT_API_KEY }}
        run: >-
          flutter build apk --release
          --build-name=${{ steps.ver.outputs.name }}
          --build-number=${{ steps.ver.outputs.code }}
          --dart-define=OPENCELLID_API_KEY=${{ secrets.OPENCELLID_API_KEY }}

      # app build.gradle сам подписывает release debug-ключом, поэтому
      # Flutter выдаёт app-release.apk (не unsigned). Переподписываем
      # настоящим ключом из секретов (apksigner заменяет подпись).
      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -e
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=build/app/outputs/flutter-apk/app-release.apk
          cp "$APK" cellka-in.apk
          "$BT/zipalign" -f -p 4 cellka-in.apk cellka-aligned.apk
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Signing with repository keystore"
            echo "$KEYSTORE_BASE64" | base64 -d > cellka-key.p12
            "$BT/apksigner" sign --ks-type PKCS12 --ks cellka-key.p12 \
              --ks-key-alias cellka --ks-pass env:KEYSTORE_PASSWORD \
              --out cellka-release.apk cellka-aligned.apk
            rm -f cellka-key.p12
          else
            echo "::warning::KEYSTORE_BASE64 not set — debug-signed, no over-the-top updates"
            cp cellka-aligned.apk cellka-release.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: cellka-release-apk
          path: cellka-release.apk

      # Тег берём из input (ручной запуск) или из ref (push тега);
      # action-gh-release создаст тег, если его нет.
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: cellka-release.apk
          generate_release_notes: true
